model: d1m
robot_id: D1M-B

system:
  task_hub:
    obstacle_snapshot_enabled: true
    obstacle_photo_enabled: false

navigation:
  global_planner:
    parameters:
      multi_map_nav_node:
        ros__parameters:
          coarse_xy_tolerance: 0.3
          coarse_yaw_tolerance: 0.3
          position_only_xy_tolerance: 0.5
  slam:
    parameters:
      laser_mapping:
        ros__parameters:
          rtk:
            lidar_recovery:
              min_downsampled_points: 200            # TRACKING 与 RECOVERING 共用的降采样点数下限
              min_effective_points: 60              # TRACKING 与 RECOVERING 共用的有效匹配点数下限
          initial_alignment:
            position: [28.5, -50.0, 1.0]
            yaw: 270.0
          navigation_health:
            data_timeout: 0.3
  local_planner:
    parameters:
      localPlanner:
          ros__parameters:
            terrainTimeout: 0.4
      pathFollower:
        ros__parameters:
          pathTimeout: 0.3
          tracking_mode: "turn_feasible"
          turn_forward_speed_samples: [0.0]
          turn_lateral_speed_samples: [0.5]
          turn_lateral_zero_above_speed: 1.0
          turn_response_time: 0.2
  # D1M G90 receiver and NTRIP overrides; keep credentials on this device.
  gnss:
    ntrip_parameters:
      ntrip_client:
        ros__parameters:
          username: "6hhjc1578"
          password: "53946"
          rtk_port: /dev/ttyS0
