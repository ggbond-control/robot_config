model: d1m
robot_id: D1M-A

system:
  task_hub:
    obstacle_snapshot_enabled: true
    obstacle_photo_enabled: false
  mqtt:
    host: 121.41.75.74
navigation:
  nav_bridge:
    parameters:
      nav_bridge_node:
        ros__parameters:
          stand_target_gait: 3  # RUN; 0=WALK, 33=MOUNTAIN
  global_planner:
    parameters:
      global_costmap:
        global_costmap:
          ros__parameters:
            footprint: '[[0.475, 0.225], [0.475, -0.225], [-0.475, -0.225], [-0.475, 0.225]]'
            footprint_padding: 0.02
            inflation_layer:
              inflation_radius: 0.6
      local_costmap:
        local_costmap:
          ros__parameters:
            footprint: '[[0.475, 0.225], [0.475, -0.225], [-0.475, -0.225], [-0.475, 0.225]]'
            footprint_padding: 0.02
      planner_server:
        ros__parameters:
          GridBased:
            straightening:
              min_clearance: 0.0
      multi_map_nav_node:
        ros__parameters:
          #global_replanning_mode: event_driven
          coarse_xy_tolerance: 0.3
          coarse_yaw_tolerance: 0.3
          position_only_xy_tolerance: 0.5
  slam:
    parameters:
      laser_mapping:
        ros__parameters:
          rtk:
            lidar_recovery:
              min_downsampled_points: 200            # TRACKING 与 RECOVERING 共用的降采样点数下限
              min_effective_points: 60              # TRACKING 与 RECOVERING 共用的有效匹配点数下限
          initial_alignment:
            #position: [29.592, -53.89, 1.0]
            #yaw: 270.0
            position: [0.0, 0.0, 1.0]
            yaw: 0.0
            #position: [73.952, 133.137, 1.0]
            #yaw: 90.0
          navigation_health:
            data_timeout: 0.3
  local_planner:
    parameters:
      localPlanner:
          ros__parameters:
            terrainTimeout: 0.4
      pathFollower:
        ros__parameters:
          pathTimeout: 0.3
          curvatureDecelGain: 1.5  # 放宽弯道减速；原型号值为3.5
  # D1M G90 receiver and NTRIP overrides; keep credentials on this device.
  gnss:
    ntrip_parameters:
      ntrip_client:
        ros__parameters:
          username: "6hhjc1578"
          password: "53946"
          rtk_port: /dev/ttyS0
